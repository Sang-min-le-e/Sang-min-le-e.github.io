<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 마크다운으로 쓴 주제를 보여 주는 페이지.  note.html#ds/array-vs-list  →  ds/array-vs-list.md 를 불러온다 -->
  <title>서버실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-root="./">

<main class="wrap article">
  <div class="crumb" data-crumb></div>
  <div class="md" id="note"></div>
  <nav class="pager" data-pager></nav>
</main>

<script>
  // layout.js가 경로 표시와 이전/다음 링크를 만들 수 있게 주소에서 주제 위치를 꺼내 둔다
  document.body.dataset.topic = decodeURIComponent(location.hash.slice(1));
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="assets/topics.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/markdown.js"></script>
<script>
  (async () => {
    const path = document.body.dataset.topic;
    const el = document.getElementById("note");
    // 경로에는 폴더/이름만 허용 (다른 곳의 파일을 불러오지 않게)
    if (!/^[\w-]+\/[\w-]+$/.test(path)) {
      el.innerHTML = `<div class="note"><strong>주제를 찾을 수 없어요.</strong> <a href="index.html">서버실로 돌아가기</a></div>`;
      return;
    }
    const topic = window.CS.flat.find(t => t.path === path);
    const title = await renderMarkdown(el, `${path}.md`);
    document.title = `${title || (topic && topic.name) || path} · 서버실`;
  })();
  // 이전/다음으로 다른 주제에 갈 때 같은 페이지라 새로 그려야 한다
  addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
