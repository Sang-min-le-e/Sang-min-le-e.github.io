<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Compiled Datacenter</title>
  <meta name="description" content="CS 기초부터 백엔드, 인프라, CI/CD까지 직접 켜 보며 정리하는 공부 노트">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-root="./">

<!-- 화면은 주소의 # 뒤로 바뀐다:  #/ 데이터센터,  #/rack/001 랙 화면(과목 목록),  #/rack/001/ds 서버 화면(그 과목의 주제 목록)
     프로젝트는 각자 HTML 파일(projects/NNN-이름.html)이고, 홈이 projects 폴더를 훑어 랙에 꽂는다 -->
<main class="wrap-wide" id="app"></main>

<script src="assets/topics.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/project-page.js"></script>
<script>
  const { racks, flat, rackName, topicHref, STATUS_LABEL } = window.CS;
  const app = document.getElementById("app");
  const SLOTS = Math.max(...racks.map(r => r.servers.length)); // 랙 높이를 맞추려고 가장 큰 랙 기준
  const MAX_LEDS = 7; // 서버 칸 하나에 램프로 그릴 수 있는 주제 수
  const lit = list => list.filter(t => t.status !== "todo").length;
  const topicsOf = rack => rack.servers.flatMap(s => s.topics);
  const rackHref = (rack, dir) => `#/rack/${rack.id}` + (dir ? `/${dir}` : "");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- 프로젝트 찾기 ----------
  // projects 폴더의 NNN-이름.html 파일 목록을 알아낸다.
  // 로컬 미리보기 서버는 폴더 목록 페이지를 주고, GitHub Pages는 안 주니 그때는 GitHub API로 묻는다.
  const PROJECT_FILE = /^\d{3}-[\w-]+\.html$/;
  async function listProjectFiles() {
    try {
      const res = await fetch("projects/");
      if (res.ok && (res.headers.get("content-type") || "").includes("html")) {
        const names = [...(await res.text()).matchAll(/href="([^"]+)"/g)].map(m => decodeURIComponent(m[1]));
        const found = names.filter(n => PROJECT_FILE.test(n));
        if (found.length) return found;
      }
    } catch (e) { /* 다음 방법으로 */ }
    try {
      const res = await fetch("https://api.github.com/repos/Sang-min-le-e/Sang-min-le-e.github.io/contents/projects");
      if (res.ok) return (await res.json()).map(f => f.name).filter(n => PROJECT_FILE.test(n));
    } catch (e) { /* 목록을 못 받음 */ }
    return null;
  }
  // 파일을 받아 맨 위 meta에서 이름, 소개, 상태, 스택을 읽는다
  let projectsPromise;
  function loadProjects() {
    projectsPromise = projectsPromise || (async () => {
      const files = await listProjectFiles();
      if (!files) return null;
      const list = await Promise.all(files.sort().map(async name => {
        try {
          const html = await (await fetch("projects/" + name)).text();
          return readProjectMeta(new DOMParser().parseFromString(html, "text/html"), name);
        } catch (e) { return null; }
      }));
      return list.filter(Boolean);
    })();
    return projectsPromise;
  }

  // ---------- 랙 그림 ----------
  // onUnit(server): 서버 칸을 눌렀을 때, onRack(): 명판이나 몸체를 눌렀을 때 (없으면 누를 수 없음), current: 지금 보고 있는 서버
  function drawRack(rack, { onUnit, onRack, current } = {}) {
    const NS = "http://www.w3.org/2000/svg";
    const unitH = 56, gap = 6, top = 50;
    const bottom = top + SLOTS * unitH + (SLOTS - 1) * gap;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 220 ${bottom + 40}`);
    svg.setAttribute("class", "rack-art" + (onRack ? " clickable" : ""));
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `${rackName(rack)} ${rack.name}: 서버 ${rack.servers.length}대`);
    svg.style.viewTransitionName = "rack-" + rack.id; // 화면이 바뀌어도 같은 랙으로 이어져 날아간다
    const el = (tag, attrs, parent) => {
      const n = document.createElementNS(NS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(n);
      return n;
    };
    if (onRack) svg.addEventListener("click", onRack);

    el("rect", { class: "rack-frame", x: 10, y: 10, width: 200, height: bottom + 4, rx: 6 });
    const plate = el("g", onRack ? { class: "rack-plate-link", tabindex: 0, role: "link", "aria-label": `${rackName(rack)} ${rack.name} 열기` } : {});
    if (onRack) plate.addEventListener("keydown", e => { if (e.key === "Enter") onRack(); });
    el("rect", { class: "rack-plate", x: 64, y: 18, width: 92, height: 22, rx: 2 }, plate);
    el("text", { class: "rack-plate-text", x: 110, y: 32.5, "text-anchor": "middle" }, plate).textContent = rackName(rack);
    [22, 190].forEach(x => {
      el("rect", { class: "rack-rail", x, y: top - 4, width: 8, height: bottom - top + 8 });
      for (let y = top; y < bottom; y += 12) el("rect", { class: "rack-hole", x: x + 2.5, y, width: 3, height: 3 });
    });
    [26, 182].forEach(x => el("rect", { class: "rack-foot", x, y: bottom + 14, width: 12, height: 8 }));

    // 아래 칸부터 채우고, 남는 칸은 빈 패널
    for (let i = 0; i < SLOTS; i++) {
      const y = bottom - unitH - i * (unitH + gap);
      const server = rack.servers[i];
      if (!server) {
        el("rect", { class: "blank", x: 34, y, width: 152, height: unitH, rx: 3 });
        [y + 18, y + 28, y + 38].forEach(ly => el("line", { class: "blank-line", x1: 46, y1: ly, x2: 174, y2: ly }));
        continue;
      }
      const g = el("g", { class: "unit" + (server === current ? " current" : ""), tabindex: 0, role: "link", "aria-label": `${server.host} ${server.title} 보기` });
      g.addEventListener("click", e => { e.stopPropagation(); onUnit && onUnit(server); });
      g.addEventListener("keydown", e => { if (e.key === "Enter") onUnit && onUnit(server); });

      el("rect", { class: "unit-body", x: 34, y, width: 152, height: unitH, rx: 3 }, g);
      el("circle", { class: "power" + (lit(server.topics) ? " on" : ""), cx: 44, cy: y + 13, r: 3 }, g);
      el("text", { class: "unit-no", x: 52, y: y + 17 }, g).textContent = server.host;
      el("text", { class: "unit-title", x: 41, y: y + 40 }, g).textContent = server.title;

      const right = 176, step = 9;
      if (server.topics.length > MAX_LEDS) {
        // 램프가 서버 번호와 겹치기 시작하면 켜진 수를 숫자로 보여 준다
        el("text", { class: "unit-count", x: right + 3, y: y + 17, "text-anchor": "end" }, g).textContent = `${lit(server.topics)}/${server.topics.length}`;
      } else {
        const ledLeft = right - (server.topics.length - 1) * step;
        server.topics.forEach((t, j) => {
          const led = el("circle", { class: "led " + t.status, cx: ledLeft + j * step, cy: y + 13, r: 3 }, g);
          el("title", {}, led).textContent = `${t.name} · ${STATUS_LABEL[t.status]}`;
        });
      }
      // 통풍구는 과목 이름이 끝난 뒤 오른쪽 아래에만
      for (let x = 158; x + 3 <= right + 4; x += 5) el("rect", { class: "vent", x, y: y + 28, width: 2.5, height: 16, rx: 1 }, g);
      el("rect", { class: "activity", x: 41, y: y + unitH - 8, width: 8, height: 2.5, rx: 1, style: `animation-delay:${(i * 0.43 + Number(rack.id) * 0.61) % 2.2}s` }, g);
    }
    return svg;
  }

  function serverCard(rack, s) {
    return `
      <a class="server-card" href="${rackHref(rack, s.dir)}">
        <div class="server-card-head">
          <span class="unit-tag">${s.host}</span>
          <div class="server-card-title">
            <h3>${s.title}</h3>
            <span class="server-lamps">${lit(s.topics)}/${s.topics.length}</span>
          </div>
        </div>
        <p class="server-card-desc">${s.desc}</p>
      </a>`;
  }

  // 서버 화면의 주제 한 줄. 예정(todo) 주제는 아직 파일이 없으니 링크를 걸지 않는다
  function topicRow(s, t) {
    const inner = `<i class="led-dot ${t.status}" aria-hidden="true"></i><span class="name">${t.name}</span><span class="hook">${t.hook}</span>${window.CS.badge(t.status)}`;
    return t.status === "todo"
      ? `<li><span class="disabled">${inner}</span></li>`
      : `<li><a href="${topicHref({ ...t, path: `${s.dir}/${t.slug}` })}">${inner}</a></li>`;
  }

  function monitor() {
    const count = { todo: 0, draft: 0, understood: 0, interview: 0 };
    flat.forEach(t => count[t.status]++);
    const total = flat.length;
    const color = { interview: "var(--accent)", understood: "var(--primary)", draft: "var(--focus-tint)" };
    const servers = racks.flatMap(r => r.servers);
    return `
      <section class="monitor">
        <div class="monitor-head">
          <div>
            <div class="eyebrow">Room Monitor</div>
            <strong>초록불 ${count.interview} / ${total}</strong>
          </div>
          <div class="monitor-stats">
            <span><b>${racks.filter(r => lit(topicsOf(r))).length}</b> / ${racks.length} 랙 가동</span>
            <span><b>${servers.filter(s => lit(s.topics)).length}</b> / ${servers.length} 서버 가동</span>
            <span><b>${total - count.todo}</b> 램프 켜짐</span>
          </div>
        </div>
        <div class="progress-bar">
          ${["interview", "understood", "draft"].map(s => `<span style="width:${count[s] / total * 100}%;background:${color[s]}"></span>`).join("")}
        </div>
        <div class="legend">
          ${["interview", "understood", "draft", "todo"].map(s =>
            `<span><i class="led-dot ${s}"></i>${STATUS_LABEL[s]} ${count[s]}</span>`).join("")}
        </div>
      </section>`;
  }

  // ---------- 운영자 정보 (GitHub 프로필 README 기준) ----------
  const PROFILE = {
    name: "이상민",
    nameEn: "Sangmin Lee",
    school: "경희대학교",
    major: "소프트웨어융합학과",
    classOf: "23학번",
    schoolEn: "Kyung Hee University · Software Convergence '23",
    avatar: "https://github.com/Sang-min-le-e.png",
    github: "https://github.com/Sang-min-le-e",
    experience: [
      { title: "LG Aimers 9기 수료", org: "LG AI Research", period: "2026.06.22 – 2026.09.02", kind: "교육 · 수료" },
      { title: "고등·중등 과학 강사", org: "차오름 수학과학학원", period: "2023.01 – 2024.05, 2026.01 – 현재", kind: "강의" },
    ],
    stack: [
      { group: "Languages & Frameworks", items: ["C++", "Python", "Dart", "Flutter"] },
      { group: "Infrastructure & Cloud", items: ["Linux", "Docker"] },
    ],
    contact: [
      { label: "네이버 메일", value: "sangmin351212@naver.com", href: "mailto:sangmin351212@naver.com" },
      { label: "학교 메일", value: "sangmin351212@khu.ac.kr", href: "mailto:sangmin351212@khu.ac.kr" },
      { label: "GitHub", value: "github.com/Sang-min-le-e", href: "https://github.com/Sang-min-le-e" },
    ],
  };

  // 데이터센터 출입증. 홈에서 누르면 프로필로, 프로필 화면 머리에서는 크게 보인다
  function operatorBadge(big) {
    const tag = big ? "div" : "a";
    return `
      <${tag} class="op-badge${big ? " big" : ""}" ${big ? "" : 'href="#/profile"'} style="view-transition-name: operator-badge">
        <div class="op-strap" aria-hidden="true"><span class="op-hole"></span></div>
        <div class="op-head"><span class="op-led" aria-hidden="true"></span>Operator · Access Granted</div>
        <div class="op-body">
          <img class="op-avatar" src="${PROFILE.avatar}" alt="" width="64" height="64">
          <div class="op-id">
            <div class="op-name">${PROFILE.name}<span>${PROFILE.nameEn}</span></div>
            <div class="op-school"><strong>${PROFILE.school} ${PROFILE.major}</strong> ${PROFILE.classOf}</div>
            <div class="op-en">${PROFILE.schoolEn}</div>
          </div>
        </div>
        <div class="op-foot"><span>Clearance · All Racks</span>${big ? "" : "<span>Profile →</span>"}</div>
      </${tag}>`;
  }

  // ---------- 화면 4: 프로필 ----------
  function profileView() {
    document.title = `Profile · ${PROFILE.name} · My Compiled Datacenter`;
    app.innerHTML = `
      <nav class="rack-nav" aria-label="이동">
        <a class="back-link" href="#/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          데이터센터
        </a>
      </nav>
      <article class="article project profile">
        <div class="eyebrow">Profile · Operator</div>
        ${operatorBadge(true)}

        <h2><span class="step">01</span>Education</h2>
        <div class="edu">
          <div class="edu-school">${PROFILE.school}</div>
          <div class="edu-major">${PROFILE.major} <span>${PROFILE.classOf}</span></div>
          <div class="edu-en">${PROFILE.schoolEn}</div>
        </div>

        <h2><span class="step">02</span>Experience & Certification</h2>
        <ol class="timeline">
          ${PROFILE.experience.map(e => `
            <li>
              <span class="tl-kind">${e.kind}</span>
              <strong>${e.title}</strong>
              <span class="tl-org">${e.org}</span>
              <span class="tl-period">${e.period}</span>
            </li>`).join("")}
        </ol>

        <h2><span class="step">03</span>Tech Stack</h2>
        ${PROFILE.stack.map(g => `
          <h3>${g.group}</h3>
          <div class="stack-chips">${g.items.map(s => `<span>${s}</span>`).join("")}</div>`).join("")}

        <h2><span class="step">04</span>Contact</h2>
        <ul class="contact-list">
          ${PROFILE.contact.map(c => `
            <li><span>${c.label}</span><a href="${c.href}"${c.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${c.value}</a></li>`).join("")}
        </ul>
      </article>`;
  }

  // ---------- 화면 1: 데이터센터 ----------
  function roomView() {
    document.title = window.CS.SITE_NAME;
    app.innerHTML = `
      <section class="hero">
        <div class="hero-text">
          <div class="eyebrow">CS · Stack · Projects · ${racks.length} Racks · ${flat.length} Lamps</div>
          <h1>My <em>Compiled</em> Datacenter<span class="h1-sub">공부한 내용을 프로젝트로</span></h1>
        </div>
        ${operatorBadge()}
      </section>
      <div class="zone-head">
        <span class="zone-tag">Lab</span>
        <h2>Study Rack</h2>
        <p>직접 공부하고 정리한 것들</p>
      </div>
      <section class="room" aria-label="공부 랙들"></section>
      ${monitor()}
      <div class="zone-head">
        <span class="zone-tag prod">Production</span>
        <h2>프로젝트</h2>
        <p>공부한 것으로 실제로 해본 경험</p>
      </div>
      ${prodRack()}`;
    const room = app.querySelector(".room");
    racks.forEach(rack => {
      const all = topicsOf(rack);
      const card = document.createElement("div");
      card.className = "rack-card";
      card.appendChild(drawRack(rack, {
        onRack: () => { location.hash = rackHref(rack); },
        onUnit: s => { location.hash = rackHref(rack, s.dir); },
      }));
      card.insertAdjacentHTML("beforeend", `
        <a class="rack-label" href="${rackHref(rack)}">
          <span class="rack-id">${rackName(rack)}</span>
          <span class="rack-name" style="view-transition-name: rackname-${rack.id}">${rack.name}</span>
          <span class="rack-meta">서버 ${rack.servers.length}대 · 램프 ${lit(all)}/${all.length}</span>
        </a>`);
      room.appendChild(card);
    });
    fillProdRack();
  }

  // ---------- Production 랙 (가로) ----------
  // 프로젝트 파일 목록을 받아 오는 동안은 빈 패널만 보이고, 받으면 채운다
  function prodSlots(list) {
    const n = Math.max(3, list.length); // 빈 칸은 빈 패널로 채운다
    return Array.from({ length: n }, (_, i) => {
      const p = list[i];
      return p ? `
        <a class="prod-server" href="projects/${p.file}" style="view-transition-name: project-${p.id}">
          <span class="prod-led ${p.status}" aria-hidden="true"></span>
          <span class="prod-id">
            <span class="prod-host">${p.host}${p.sample ? ' <span class="sample-tag">예시</span>' : ""}</span>
            <span class="prod-name">${esc(p.name)}</span>
          </span>
          <span class="prod-summary">${esc(p.summary)}</span>
          <span class="prod-stack">${p.stack.slice(0, 5).map(s => `<span>${esc(s)}</span>`).join("")}</span>
          <span class="prod-status">${p.statusLabel}</span>
        </a>` : `<div class="prod-blank" aria-hidden="true"></div>`;
    }).join("");
  }

  function prodRack() {
    return `
      <section class="prod-rack" aria-label="프로젝트 랙">
        <div class="prod-plate">RACK-P01 · PRODUCTION</div>
        <div class="prod-slots" id="prod-slots">${prodSlots([])}</div>
      </section>`;
  }

  async function fillProdRack() {
    const list = await loadProjects();
    const slots = document.getElementById("prod-slots");
    if (!slots) return; // 그 사이 다른 화면으로 갔으면 그만
    slots.innerHTML = list
      ? prodSlots(list)
      : `<p class="prod-error">프로젝트 목록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>${prodSlots([])}`;
  }

  // ---------- 화면 2: 랙 하나 ----------
  function rackView(rack) {
    const i = racks.indexOf(rack);
    const prev = racks[i - 1], next = racks[i + 1];
    const all = topicsOf(rack);
    document.title = `${rackName(rack)} ${rack.name} · My Compiled Datacenter`;
    app.innerHTML = `
      <nav class="rack-nav" aria-label="랙 이동">
        <a class="back-link" href="#/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          데이터센터
        </a>
        <div class="rack-switch">
          ${prev ? `<a class="btn" href="${rackHref(prev)}">← ${rackName(prev)}</a>` : ""}
          ${next ? `<a class="btn" href="${rackHref(next)}">${rackName(next)} →</a>` : ""}
        </div>
      </nav>
      <div class="rack-view">
        <div class="rack-view-art"></div>
        <div class="rack-view-body">
          <div class="eyebrow">${rackName(rack)} · 서버 ${rack.servers.length}대 · 램프 ${lit(all)}/${all.length}</div>
          <h1 style="view-transition-name: rackname-${rack.id}">${rack.name}</h1>
          <p class="rack-desc">${rack.desc}</p>
          <div class="server-grid">${rack.servers.map(s => serverCard(rack, s)).join("")}</div>
        </div>
      </div>`;
    app.querySelector(".rack-view-art").appendChild(drawRack(rack, { onUnit: s => { location.hash = rackHref(rack, s.dir); } }));
  }

  // ---------- 화면 3: 서버 하나 (과목의 주제 목록) ----------
  function serverView(rack, server) {
    const i = rack.servers.indexOf(server);
    const prev = rack.servers[i - 1], next = rack.servers[i + 1];
    document.title = `${server.title} · ${rackName(rack)} · My Compiled Datacenter`;
    app.innerHTML = `
      <nav class="rack-nav" aria-label="서버 이동">
        <a class="back-link" href="${rackHref(rack)}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          ${rackName(rack)} · ${rack.name}
        </a>
        <div class="rack-switch">
          ${prev ? `<a class="btn" href="${rackHref(rack, prev.dir)}">← ${prev.title}</a>` : ""}
          ${next ? `<a class="btn" href="${rackHref(rack, next.dir)}">${next.title} →</a>` : ""}
        </div>
      </nav>
      <div class="rack-view">
        <div class="rack-view-art"></div>
        <div class="rack-view-body">
          <div class="eyebrow">${server.host} · 램프 ${lit(server.topics)}/${server.topics.length}</div>
          <h1>${server.title}</h1>
          <p class="rack-desc">${server.desc}</p>
          <ul class="topic-list server-topics">${server.topics.map(t => topicRow(server, t)).join("")}</ul>
        </div>
      </div>`;
    app.querySelector(".rack-view-art").appendChild(drawRack(rack, {
      current: server,
      onUnit: s => { location.hash = rackHref(rack, s.dir); },
    }));
  }

  // ---------- 주소 → 화면 ----------
  function route() {
    const h = location.hash;
    if (h.startsWith("#/profile")) { profileView(); scrollTo(0, 0); return; }
    // 예전 주소(#/project/001)는 프로젝트 파일로 보낸다
    const pm = h.match(/^#\/project\/(\d+)/);
    if (pm) {
      loadProjects().then(list => {
        const p = list && list.find(p => p.id === pm[1]);
        location.replace(p ? "projects/" + p.file : "#/");
      });
      return;
    }
    let m = h.match(/^#\/rack\/(\d+)(?:\/([\w-]+))?/);
    // 예전 주소(#rack-001, #srv-ds)도 받아 준다
    if (!m && (m = h.match(/^#rack-(\d+)/))) m = [, m[1]];
    if (!m && (m = h.match(/^#srv-([\w-]+)/))) {
      const r = racks.find(r => r.servers.some(s => s.dir === m[1]));
      m = r ? [, r.id, m[1]] : null;
    }
    const rack = m && racks.find(r => r.id === m[1]);
    const server = rack && rack.servers.find(s => s.dir === m[2]);
    if (server) serverView(rack, server);
    else if (rack) rackView(rack);
    else roomView();
    scrollTo(0, 0);
  }

  // 화면을 바꿀 때: 같은 랙은 제자리에서 다음 위치로 날아가고, 나머지는 부드럽게 바뀐다
  function transition() {
    if (document.startViewTransition && !reduceMotion) {
      document.startViewTransition(route);
    } else {
      route();
      if (!reduceMotion) { app.classList.remove("app-enter"); void app.offsetWidth; app.classList.add("app-enter"); }
    }
  }

  addEventListener("hashchange", transition);
  addEventListener("keydown", e => { if (e.key === "Escape" && /^#\/(rack|profile)/.test(location.hash)) location.hash = "#/"; });
  route();
</script>
</body>
</html>
