<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>면접까지 가는 컴퓨터 사이언스 서버실</title>
  <meta name="description" content="CS 기초부터 백엔드, 인프라, CI/CD까지 직접 켜 보며 정리하는 공부 노트">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-root="./">

<!-- 화면은 주소의 # 뒤로 바뀐다:  #/ 서버실,  #/rack/001 랙 화면,  #/rack/001/ds 랙 화면 + 서버 강조,  #/project/001 프로젝트 화면 -->
<main class="wrap-wide" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="assets/topics.js"></script>
<script src="assets/projects.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/markdown.js"></script>
<script>
  const { racks, flat, rackName, topicHref, STATUS_LABEL } = window.CS;
  const app = document.getElementById("app");
  const SLOTS = Math.max(...racks.map(r => r.servers.length)); // 랙 높이를 맞추려고 가장 큰 랙 기준
  const lit = list => list.filter(t => t.status !== "todo").length;
  const topicsOf = rack => rack.servers.flatMap(s => s.topics);
  const rackHref = (rack, dir) => `#/rack/${rack.id}` + (dir ? `/${dir}` : "");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const projects = window.PROJECTS || [];
  const PROD_SLOTS = Math.max(3, projects.length); // 빈 칸은 빈 패널로 채운다
  const PROJECT_STATUS = { live: "운영 중", dev: "개발 중", archived: "보관" };
  const prodHost = p => "prod-" + p.id;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- 랙 그림 ----------
  // onUnit(server): 서버 칸을 눌렀을 때, onRack(): 명판이나 몸체를 눌렀을 때 (없으면 누를 수 없음)
  function drawRack(rack, { onUnit, onRack } = {}) {
    const NS = "http://www.w3.org/2000/svg";
    const unitH = 56, gap = 6, top = 50;
    const bottom = top + SLOTS * unitH + (SLOTS - 1) * gap;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 220 ${bottom + 40}`);
    svg.setAttribute("class", "rack-art" + (onRack ? " clickable" : ""));
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", `${rackName(rack)} ${rack.name}: 서버 ${rack.servers.length}대`);
    svg.style.viewTransitionName = "rack-" + rack.id; // 화면이 바뀌어도 같은 랙으로 이어져 날아간다
    const el = (tag, attrs, parent) => {
      const n = document.createElementNS(NS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(n);
      return n;
    };
    if (onRack) svg.addEventListener("click", onRack);

    el("rect", { class: "rack-frame", x: 10, y: 10, width: 200, height: bottom + 4, rx: 6 });
    const plate = el("g", onRack ? { class: "rack-plate-link", tabindex: 0, role: "link", "aria-label": `${rackName(rack)} ${rack.name} 열기` } : {});
    if (onRack) plate.addEventListener("keydown", e => { if (e.key === "Enter") onRack(); });
    el("rect", { class: "rack-plate", x: 64, y: 18, width: 92, height: 22, rx: 2 }, plate);
    el("text", { class: "rack-plate-text", x: 110, y: 32.5, "text-anchor": "middle" }, plate).textContent = rackName(rack);
    [22, 190].forEach(x => {
      el("rect", { class: "rack-rail", x, y: top - 4, width: 8, height: bottom - top + 8 });
      for (let y = top; y < bottom; y += 12) el("rect", { class: "rack-hole", x: x + 2.5, y, width: 3, height: 3 });
    });
    [26, 182].forEach(x => el("rect", { class: "rack-foot", x, y: bottom + 14, width: 12, height: 8 }));

    // 아래 칸부터 채우고, 남는 칸은 빈 패널
    for (let i = 0; i < SLOTS; i++) {
      const y = bottom - unitH - i * (unitH + gap);
      const server = rack.servers[i];
      if (!server) {
        el("rect", { class: "blank", x: 34, y, width: 152, height: unitH, rx: 3 });
        [y + 18, y + 28, y + 38].forEach(ly => el("line", { class: "blank-line", x1: 46, y1: ly, x2: 174, y2: ly }));
        continue;
      }
      const g = el("g", { class: "unit", tabindex: 0, role: "link", "aria-label": `${server.host} ${server.title} 보기` });
      g.addEventListener("click", e => { e.stopPropagation(); onUnit && onUnit(server); });
      g.addEventListener("keydown", e => { if (e.key === "Enter") onUnit && onUnit(server); });

      el("rect", { class: "unit-body", x: 34, y, width: 152, height: unitH, rx: 3 }, g);
      el("circle", { class: "power" + (lit(server.topics) ? " on" : ""), cx: 44, cy: y + 13, r: 3 }, g);
      el("text", { class: "unit-no", x: 52, y: y + 17 }, g).textContent = server.host;
      el("text", { class: "unit-title", x: 41, y: y + 40 }, g).textContent = server.title;

      const right = 176, step = 9;
      const ledLeft = right - (server.topics.length - 1) * step;
      server.topics.forEach((t, j) => {
        const led = el("circle", { class: "led " + t.status, cx: ledLeft + j * step, cy: y + 13, r: 3 }, g);
        el("title", {}, led).textContent = `${t.name} · ${STATUS_LABEL[t.status]}`;
      });
      // 통풍구는 과목 이름이 끝난 뒤 오른쪽 아래에만
      for (let x = 158; x + 3 <= right + 4; x += 5) el("rect", { class: "vent", x, y: y + 28, width: 2.5, height: 16, rx: 1 }, g);
      el("rect", { class: "activity", x: 41, y: y + unitH - 8, width: 8, height: 2.5, rx: 1, style: `animation-delay:${(i * 0.43 + Number(rack.id) * 0.61) % 2.2}s` }, g);
    }
    return svg;
  }

  function serverCard(s) {
    return `
      <article class="server-card" id="srv-${s.dir}">
        <div class="server-card-head">
          <span class="unit-tag">${s.host}</span>
          <div class="server-card-title">
            <h3>${s.title}</h3>
            <span class="server-lamps">${lit(s.topics)}/${s.topics.length}</span>
          </div>
        </div>
        <ul class="mini-topics">
          ${s.topics.map(t => {
            const tip = `${t.hook} · ${STATUS_LABEL[t.status]}`;
            const inner = `<i class="led-dot ${t.status}" aria-hidden="true"></i><span class="name">${t.name}</span><span class="sr-only">(${STATUS_LABEL[t.status]})</span>`;
            return t.status === "todo"
              ? `<li><span class="disabled" title="${tip}">${inner}</span></li>`
              : `<li><a href="${topicHref({ ...t, path: `${s.dir}/${t.slug}` })}" title="${tip}">${inner}</a></li>`;
          }).join("")}
        </ul>
      </article>`;
  }

  function monitor() {
    const count = { todo: 0, draft: 0, understood: 0, interview: 0 };
    flat.forEach(t => count[t.status]++);
    const total = flat.length;
    const color = { interview: "var(--accent)", understood: "var(--primary)", draft: "var(--focus-tint)" };
    const servers = racks.flatMap(r => r.servers);
    return `
      <section class="monitor">
        <div class="monitor-head">
          <div>
            <div class="eyebrow">Room Monitor</div>
            <strong>초록불 ${count.interview} / ${total}</strong>
          </div>
          <div class="monitor-stats">
            <span><b>${racks.filter(r => lit(topicsOf(r))).length}</b> / ${racks.length} 랙 가동</span>
            <span><b>${servers.filter(s => lit(s.topics)).length}</b> / ${servers.length} 서버 가동</span>
            <span><b>${total - count.todo}</b> 램프 켜짐</span>
          </div>
        </div>
        <div class="progress-bar">
          ${["interview", "understood", "draft"].map(s => `<span style="width:${count[s] / total * 100}%;background:${color[s]}"></span>`).join("")}
        </div>
        <div class="legend">
          ${["interview", "understood", "draft", "todo"].map(s =>
            `<span><i class="led-dot ${s}"></i>${STATUS_LABEL[s]} ${count[s]}</span>`).join("")}
        </div>
      </section>`;
  }

  // ---------- 화면 1: 서버실 ----------
  function roomView() {
    document.title = window.CS.SITE_NAME;
    app.innerHTML = `
      <section class="hero">
        <div class="eyebrow">Server Room · ${racks.length} Racks · ${flat.length} Lamps</div>
        <h1>면접까지 가는 <em>컴퓨터 사이언스</em> 서버실.</h1>
        <p>랙 하나가 큰 주제, 랙에 꽂힌 서버 한 대가 과목, 서버의 램프 하나가 주제입니다. 랙을 눌러 들어가 보세요.</p>
      </section>
      <div class="zone-head">
        <span class="zone-tag">Lab</span>
        <h2>Study Rack</h2>
        <p>직접 만져 보며 정리한 것들</p>
      </div>
      <section class="room" aria-label="공부 랙들"></section>
      ${monitor()}
      <div class="zone-head">
        <span class="zone-tag prod">Production</span>
        <h2>프로젝트</h2>
        <p>공부한 것으로 실제로 만들어 돌리는 서비스</p>
      </div>
      ${prodRack()}`;
    const room = app.querySelector(".room");
    racks.forEach(rack => {
      const all = topicsOf(rack);
      const card = document.createElement("div");
      card.className = "rack-card";
      card.appendChild(drawRack(rack, {
        onRack: () => { location.hash = rackHref(rack); },
        onUnit: s => { location.hash = rackHref(rack, s.dir); },
      }));
      card.insertAdjacentHTML("beforeend", `
        <a class="rack-label" href="${rackHref(rack)}">
          <span class="rack-id">${rackName(rack)}</span>
          <span class="rack-name" style="view-transition-name: rackname-${rack.id}">${rack.name}</span>
          <span class="rack-meta">서버 ${rack.servers.length}대 · 램프 ${lit(all)}/${all.length}</span>
        </a>`);
      room.appendChild(card);
    });
  }

  // ---------- Production 랙 (가로) ----------
  function prodRack() {
    const slots = [];
    for (let i = 0; i < PROD_SLOTS; i++) {
      const p = projects[i];
      slots.push(p ? `
        <a class="prod-server" href="#/project/${p.id}" style="view-transition-name: project-${p.id}">
          <span class="prod-led ${p.status}" aria-hidden="true"></span>
          <span class="prod-id">
            <span class="prod-host">${prodHost(p)}${p.sample ? ' <span class="sample-tag">예시</span>' : ""}</span>
            <span class="prod-name">${esc(p.name)}</span>
          </span>
          <span class="prod-summary">${esc(p.summary)}</span>
          <span class="prod-stack">${p.stack.slice(0, 5).map(s => `<span>${esc(s)}</span>`).join("")}</span>
          <span class="prod-status">${PROJECT_STATUS[p.status]}</span>
        </a>` : `<div class="prod-blank" aria-hidden="true"></div>`);
    }
    return `
      <section class="prod-rack" aria-label="프로젝트 랙">
        <div class="prod-plate">RACK-P01 · PRODUCTION</div>
        <div class="prod-slots">${slots.join("")}</div>
      </section>`;
  }

  // ---------- 화면 3: 프로젝트 하나 ----------
  function projectView(p) {
    document.title = `${prodHost(p)} ${p.name} · 서버실`;
    const sections = projectSections(p);
    const link = (url, label) => url
      ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`
      : `<span class="btn" aria-disabled="true">${label} 준비 중</span>`;
    app.innerHTML = `
      <nav class="rack-nav" aria-label="이동">
        <a class="back-link" href="#/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          서버실
        </a>
      </nav>
      <article class="article project">
        <header class="prod-face" style="view-transition-name: project-${p.id}">
          <span class="prod-led ${p.status}" aria-hidden="true"></span>
          <div class="prod-face-body">
            <div class="prod-host">${prodHost(p)} · ${PROJECT_STATUS[p.status]}${p.sample ? ' <span class="sample-tag">예시</span>' : ""}</div>
            <h1>${esc(p.name)}</h1>
            <p>${esc(p.summary)}</p>
          </div>
          <div class="prod-links">${link(p.links.github, "GitHub")}${link(p.links.demo, "서비스")}</div>
        </header>
        ${p.intro ? `<p class="lead project-intro">${esc(p.intro)}</p>` : ""}
        ${p.sample ? `<div class="note"><strong>예시 프로젝트예요.</strong> 구조를 보여 주려고 넣은 가상의 내용이라, 실제 프로젝트를 시작하면 <code>assets/projects.js</code>를 진짜 내용으로 바꾸고 <code>sample</code>을 지우세요.</div>` : ""}
        <dl class="project-meta">
          <div><dt>기간</dt><dd>${esc(p.period)}</dd></div>
          <div><dt>역할</dt><dd>${esc(p.role)}</dd></div>
          <div><dt>형태</dt><dd>${esc(p.team)}</dd></div>
        </dl>

        ${sections.map(([, title, body], i) =>
          `<h2><span class="step">${String(i + 1).padStart(2, "0")}</span>${title}</h2>${body()}`).join("")}
        ${p.doc ? `<div class="md" id="project-doc"></div>` : ""}
      </article>`;
    // 마크다운 본문은 위 칸에 이어서 번호를 붙인다
    if (p.doc) renderMarkdown(document.getElementById("project-doc"), p.doc, { startStep: sections.length + 1, dropTitle: true });
  }

  // 내용이 있는 칸만 [목록, 제목, 본문 만드는 함수]로 돌려준다
  function projectSections(p) {
    return [
      [p.stack, "기술 스택", () => `<div class="stack-chips">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div>`],
      [p.architecture, "아키텍처", () => `<ol class="arch-flow">${p.architecture.map(a => `<li>${esc(a)}</li>`).join("")}</ol>`],
      [p.features, "주요 기능", () => `<ul>${p.features.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`],
      [p.troubles, "트러블슈팅", () => p.troubles.map(t => `
          <section class="trouble">
            <h3>${esc(t.title)}</h3>
            <dl>
              <dt>문제</dt><dd>${esc(t.problem)}</dd>
              <dt>원인</dt><dd>${esc(t.cause)}</dd>
              <dt>해결</dt><dd>${esc(t.solution)}</dd>
              <dt>결과</dt><dd>${esc(t.result)}</dd>
            </dl>
          </section>`).join("")],
    ].filter(([list]) => list && list.length);
  }

  // ---------- 화면 2: 랙 하나 ----------
  function rackView(rack, focusDir) {
    const i = racks.indexOf(rack);
    const prev = racks[i - 1], next = racks[i + 1];
    const all = topicsOf(rack);
    document.title = `${rackName(rack)} ${rack.name} · 서버실`;
    app.innerHTML = `
      <nav class="rack-nav" aria-label="랙 이동">
        <a class="back-link" href="#/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          서버실
        </a>
        <div class="rack-switch">
          ${prev ? `<a class="btn" href="${rackHref(prev)}">← ${rackName(prev)}</a>` : ""}
          ${next ? `<a class="btn" href="${rackHref(next)}">${rackName(next)} →</a>` : ""}
        </div>
      </nav>
      <div class="rack-view">
        <div class="rack-view-art"></div>
        <div class="rack-view-body">
          <div class="eyebrow">${rackName(rack)} · 서버 ${rack.servers.length}대 · 램프 ${lit(all)}/${all.length}</div>
          <h1 style="view-transition-name: rackname-${rack.id}">${rack.name}</h1>
          <p class="rack-desc">${rack.desc}</p>
          <div class="server-grid">${rack.servers.map(serverCard).join("")}</div>
        </div>
      </div>`;
    app.querySelector(".rack-view-art").appendChild(drawRack(rack, { onUnit: s => highlight(s.dir) }));
    if (focusDir) highlight(focusDir);
  }

  function highlight(dir) {
    const card = document.getElementById("srv-" + dir);
    if (!card) return;
    card.classList.remove("pulse");
    void card.offsetWidth; // 다시 누를 때도 애니메이션이 처음부터
    card.classList.add("pulse");
    card.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  }

  // ---------- 주소 → 화면 ----------
  function route() {
    const h = location.hash;
    const pm = h.match(/^#\/project\/(\d+)/);
    const project = pm && projects.find(p => p.id === pm[1]);
    if (project) { projectView(project); scrollTo(0, 0); return; }
    let m = h.match(/^#\/rack\/(\d+)(?:\/([\w-]+))?/);
    // 예전 주소(#rack-001, #srv-ds)도 받아 준다
    if (!m && (m = h.match(/^#rack-(\d+)/))) m = [, m[1]];
    if (!m && (m = h.match(/^#srv-([\w-]+)/))) {
      const r = racks.find(r => r.servers.some(s => s.dir === m[1]));
      m = r ? [, r.id, m[1]] : null;
    }
    const rack = m && racks.find(r => r.id === m[1]);
    rack ? rackView(rack, m[2]) : roomView();
    scrollTo(0, 0);
  }

  // 화면을 바꿀 때: 같은 랙은 제자리에서 다음 위치로 날아가고, 나머지는 부드럽게 바뀐다
  function transition() {
    if (document.startViewTransition && !reduceMotion) {
      document.startViewTransition(route);
    } else {
      route();
      if (!reduceMotion) { app.classList.remove("app-enter"); void app.offsetWidth; app.classList.add("app-enter"); }
    }
  }

  addEventListener("hashchange", transition);
  addEventListener("keydown", e => { if (e.key === "Escape" && /^#\/(rack|project)/.test(location.hash)) location.hash = "#/"; });
  route();
</script>
</body>
</html>
